<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; font-src {{cspSource}}; script-src 'nonce-{{nonce}}';">
    <title>Nexkit Panel</title>
    <link rel="stylesheet" href="{{styleUri}}">
    <link rel="stylesheet" href="{{codiconsUri}}" />
</head>
<body>
    <!-- Preact app is rendered into #root. The static skeleton below is shown
         instantly while the webview bundle loads, then replaced by the app. -->
    <div id="root">
        <div class="container panel-skeleton" role="status" aria-busy="true">
            <div class="skeleton-tab-bar" aria-hidden="true">
                <div class="skeleton skeleton-tab"></div>
                <div class="skeleton skeleton-tab"></div>
                <div class="skeleton skeleton-tab"></div>
                <div class="skeleton skeleton-tab"></div>
            </div>
            <div class="skeleton skeleton-line skeleton-line-lg" style="width: 100%" aria-hidden="true"></div>
            <div class="skeleton-list" aria-hidden="true">
                <div class="skeleton skeleton-line skeleton-line-lg" style="width: 40%"></div>
                <div class="skeleton-row"><div class="skeleton skeleton-icon"></div><div class="skeleton skeleton-line skeleton-line-md" style="width: 85%"></div></div>
                <div class="skeleton-row"><div class="skeleton skeleton-icon"></div><div class="skeleton skeleton-line skeleton-line-md" style="width: 65%"></div></div>
                <div class="skeleton-row"><div class="skeleton skeleton-icon"></div><div class="skeleton skeleton-line skeleton-line-md" style="width: 75%"></div></div>
                <div class="skeleton-row"><div class="skeleton skeleton-icon"></div><div class="skeleton skeleton-line skeleton-line-md" style="width: 55%"></div></div>
            </div>
            <span class="skeleton-sr-only">Loading Nexkit…</span>
        </div>
    </div>
    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
    <script nonce="{{nonce}}">
        window.__NEXKIT_VERSION__ = "{{extensionVersion}}";
        window.__VSCODE_VERSION__ = "{{vscodeVersion}}";
    </script>
</body>
</html>
